name: Reusable Salesforce CI

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '22'
      sf-cli-version:
        description: 'Salesforce CLI version to use (e.g., "2.0.0" or "latest")'
        required: false
        type: string
        default: '2.141.6'
      scratch-org-duration:
        description: 'Scratch org duration in days'
        required: false
        type: number
        default: 1
      scratch-org-wait:
        description: 'Wait time for scratch org creation (minutes)'
        required: false
        type: number
        default: 30
      deploy-wait:
        description: 'Wait time for deployment (minutes)'
        required: false
        type: number
        default: 30
      test-wait:
        description: 'Wait time for tests (minutes)'
        required: false
        type: number
        default: 30
      test-level:
        description: 'Test level (RunLocalTests, RunAllTestsInOrg, etc.)'
        required: false
        type: string
        default: 'RunLocalTests'
      scratch-def-file:
        description: 'Path to scratch org definition file'
        required: false
        type: string
        default: 'config/project-scratch-def.json'
      source-dirs:
        description: 'Space-separated source dirs to deploy (e.g. "force-app examples"). Empty deploys every packageDirectory from sfdx-project.json'
        required: false
        type: string
        default: ''
      deploy-dependencies:
        description: 'Deploy the package dependencies from sfdx-project.json as source before the project (repo and tag derived from the package alias, see scripts/deploy-dependencies.sh)'
        required: false
        type: boolean
        default: false
      pre-deploy-command:
        description: 'Shell command run in the checkout before anything is deployed, e.g. to turn the source into its package form'
        required: false
        type: string
        default: ''
      pr-comment:
        description: 'Post the results comment on pull requests. Turn it off in the second of two jobs on one PR, they share the comment'
        required: false
        type: boolean
        default: true
      upload-to-codecov:
        description: 'Upload coverage to Codecov'
        required: false
        type: boolean
        default: false
      codecov-slug:
        description: 'Codecov repository slug (org/repo)'
        required: false
        type: string
        default: ''
      template-ref:
        description: 'Git ref of cicd-template to take the report scripts from. Match it with the ref in `uses:` when testing a template branch'
        required: false
        type: string
        default: 'main'
    secrets:
      SFDX_AUTH_URL_DEVHUB:
        description: 'SFDX Auth URL for Dev Hub'
        required: true
      DEPENDENCIES_TOKEN:
        description: 'Token to clone private dependency repos (public ones work without it)'
        required: false
      CODECOV_TOKEN:
        description: 'Codecov token for coverage upload'
        required: false

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      # Scripts live in this template repo, not in the caller, so check them out.
      # github.job_workflow_sha is empty for reusable workflows, hence the input.
      - name: 📥 Checkout CI scripts
        uses: actions/checkout@v4
        with:
          repository: beyond-the-cloud-dev/cicd-template
          ref: ${{ inputs.template-ref }}
          path: .cicd-template
          sparse-checkout: scripts

      - name: 🟢 Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: 🛠️ Run pre-deploy command
        if: inputs.pre-deploy-command != ''
        env:
          PRE_DEPLOY_COMMAND: ${{ inputs.pre-deploy-command }}
        run: bash -c "$PRE_DEPLOY_COMMAND"

      - name: 📦 Cache Salesforce CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-sf-cli-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-sf-cli-

      - name: ⚡ Install Salesforce CLI ${{ inputs.sf-cli-version }}
        run: |
          if [ "${{ inputs.sf-cli-version }}" = "latest" ]; then
            npm install @salesforce/cli --global
          else
            npm install @salesforce/cli@${{ inputs.sf-cli-version }} --global
          fi
          sf --version

      - name: 🔐 Authorize Dev Hub
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_DEVHUB }}" | sf org login sfdx-url --alias DevHub --set-default-dev-hub --sfdx-url-stdin
          echo "✓ Successfully authenticated with Dev Hub"

      - name: 🌱 Create scratch org
        run: |
          sf org create scratch \
            --definition-file ${{ inputs.scratch-def-file }} \
            --alias ScratchOrg \
            --wait ${{ inputs.scratch-org-wait }} \
            --duration-days ${{ inputs.scratch-org-duration }} \
            --set-default
          echo "✓ Successfully created scratch org"

      - name: 📚 Deploy dependencies
        if: inputs.deploy-dependencies
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCIES_TOKEN || github.token }}
          DEPENDENCIES_OWNER: ${{ github.repository_owner }}
          DEPLOY_WAIT: ${{ inputs.deploy-wait }}
        run: bash .cicd-template/scripts/deploy-dependencies.sh ScratchOrg

      - name: 🚀 Deploy source to scratch org
        id: deploy
        continue-on-error: true
        env:
          SOURCE_DIRS: ${{ inputs.source-dirs }}
        run: |
          mkdir -p ./tests/apex
          SOURCE_ARGS=()
          for dir in $SOURCE_DIRS; do
            SOURCE_ARGS+=(--source-dir "$dir")
          done
          sf project deploy start \
            --target-org ScratchOrg \
            "${SOURCE_ARGS[@]}" \
            --wait ${{ inputs.deploy-wait }} \
            --json > ./tests/apex/deploy-result.json

      - name: 🔎 Parse deployment result
        id: deploy-report
        if: always()
        env:
          DEPLOY_STEP_OUTCOME: ${{ steps.deploy.outcome }}
        run: node .cicd-template/scripts/deploy-report.js ./tests/apex/deploy-result.json ./tests/apex/deploy-summary.md

      - name: 🧪 Run Apex tests
        id: run-tests
        if: steps.deploy-report.outputs.status == 'success'
        continue-on-error: true
        run: |
          sf apex run test \
            --target-org ScratchOrg \
            --code-coverage \
            --result-format human \
            --output-dir ./tests/apex \
            --test-level ${{ inputs.test-level }} \
            --wait ${{ inputs.test-wait }}

      - name: 📊 Parse test results and create report
        if: always() && steps.deploy-report.outputs.status == 'success'
        id: parse-results
        run: |
          REPORT_FILE="./tests/apex/test-failures-report.log"
          SUMMARY_FILE="./tests/apex/test-summary.txt"

          mkdir -p ./tests/apex

          # Find the test result JSON file (format: test-result-{ID}.json)
          TEST_RESULT_FILE=$(find ./tests/apex -name "test-result-*.json" -not -name "*codecoverage*" -not -name "*junit*" | head -1)

          if [ -z "$TEST_RESULT_FILE" ]; then
            echo "⚠️ No test results found" > "$SUMMARY_FILE"
            echo "has_failures=false" >> $GITHUB_OUTPUT
            echo "total_tests=0" >> $GITHUB_OUTPUT
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
            echo "skipped=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "📄 Found test results: $TEST_RESULT_FILE"

          # Parse test results using jq
          TOTAL_TESTS=$(jq -r '.summary.testsRan // 0' "$TEST_RESULT_FILE")
          PASSED=$(jq -r '.summary.passing // 0' "$TEST_RESULT_FILE")
          FAILED=$(jq -r '.summary.failing // 0' "$TEST_RESULT_FILE")
          SKIPPED=$(jq -r '.summary.skipped // 0' "$TEST_RESULT_FILE")

          echo "total_tests=$TOTAL_TESTS" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT

          # Create summary
          {
            echo "=========================================="
            echo "     APEX TEST EXECUTION SUMMARY"
            echo "=========================================="
            echo ""
            echo "📊 Total Tests: $TOTAL_TESTS"
            echo "✅ Passed: $PASSED"
            echo "❌ Failed: $FAILED"
            echo "⏭️  Skipped: $SKIPPED"
            echo ""
          } > "$SUMMARY_FILE"

          if [ "$FAILED" -gt 0 ]; then
            echo "has_failures=true" >> $GITHUB_OUTPUT

            {
              echo "=========================================="
              echo "        FAILED TEST DETAILS"
              echo "=========================================="
              echo ""
            } >> "$REPORT_FILE"

            # Extract failed tests with full details
            jq -r '.tests[] | select(.Outcome == "Fail") |
              "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n" +
              "❌ TEST FAILED: \(.FullName)\n" +
              "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n" +
              "Class: \(.ApexClass.Name)\n" +
              "Method: \(.MethodName)\n" +
              "Message: \(.Message // "No message")\n" +
              "Stack Trace:\n\(.StackTrace // "No stack trace available")\n" +
              "Runtime: \(.RunTime)ms\n" +
              "\n"' "$TEST_RESULT_FILE" >> "$REPORT_FILE"

            # Create shortened summary for PR comment
            {
              echo ""
              echo "Failed Tests:"
              echo ""
            } >> "$SUMMARY_FILE"

            jq -r '.tests[] | select(.Outcome == "Fail") |
              "• \(.ApexClass.Name).\(.MethodName)\n  └─ \(.Message // "No message")"' \
              "$TEST_RESULT_FILE" >> "$SUMMARY_FILE"
          else
            echo "has_failures=false" >> $GITHUB_OUTPUT
            echo "" >> "$SUMMARY_FILE"
            echo "🎉 All tests passed successfully!" >> "$SUMMARY_FILE"
          fi

          cat "$SUMMARY_FILE"

      - name: 💬 Comment PR with results
        if: always() && github.event_name == 'pull_request' && inputs.pr-comment
        uses: actions/github-script@v7
        env:
          DEPLOY_STATUS: ${{ steps.deploy-report.outputs.status }}
          DEPLOY_SUMMARY_FILE: ./tests/apex/deploy-summary.md
          TEST_SUMMARY_FILE: ./tests/apex/test-summary.txt
          TEST_HAS_FAILURES: ${{ steps.parse-results.outputs.has_failures }}
          TEST_TOTAL: ${{ steps.parse-results.outputs.total_tests }}
          TEST_PASSED: ${{ steps.parse-results.outputs.passed }}
          TEST_FAILED: ${{ steps.parse-results.outputs.failed }}
          WORKFLOW_FILE: salesforce-ci.yml
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = require('./.cicd-template/scripts/pr-comment.js');
            await comment({ github, context, core });

      - name: 🔄 Convert Apex coverage to LCOV
        if: inputs.upload-to-codecov && inputs.codecov-slug != '' && steps.deploy-report.outputs.status == 'success'
        env:
          SOURCE_DIRS: ${{ inputs.source-dirs }}
        run: |
          # Coverage maps to files by class name. With source-dirs set, skip the
          # package dirs that were not deployed, so a class that also lives in one
          # of them (e.g. a generated copy) is reported on the deployed file.
          IGNORE_ARGS=()
          if [ -n "$SOURCE_DIRS" ]; then
            DEPLOYED=" "
            for dir in $SOURCE_DIRS; do
              dir="${dir#./}"
              DEPLOYED+="${dir%/} "
            done
            for dir in $(jq -r '.packageDirectories[].path' sfdx-project.json); do
              dir="${dir#./}"
              case "$DEPLOYED" in
                *" ${dir%/} "*) ;;
                *) IGNORE_ARGS+=(--ignore-package-directory "$dir") ;;
              esac
            done
          fi
          echo y | sf plugins install apex-code-coverage-transformer@2.23.2
          sf acc-transformer transform \
            --coverage-json ./tests/apex/test-result-codecoverage.json \
            --format lcovonly \
            --output-report ./tests/apex/lcov.info \
            "${IGNORE_ARGS[@]}"
          echo "✓ Coverage converted to LCOV format"

      - name: 📈 Upload coverage to Codecov
        if: inputs.upload-to-codecov && inputs.codecov-slug != '' && steps.deploy-report.outputs.status == 'success'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ inputs.codecov-slug }}
          flags: Apex
          files: ./tests/apex/lcov.info

      - name: 📊 Upload test results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-test-results
          path: ./tests/apex
          retention-days: 30

      - name: ❌ Fail workflow if deployment or tests failed
        if: steps.deploy-report.outputs.status != 'success' || steps.parse-results.outputs.has_failures == 'true'
        run: |
          if [ "${{ steps.deploy-report.outputs.status }}" != "success" ]; then
            echo "❌ Deployment failed (status: ${{ steps.deploy-report.outputs.status }}). See the deployment report above."
          else
            echo "❌ Apex tests failed. Check the test results artifact for details."
          fi
          exit 1

      - name: 🧹 Cleanup scratch org
        if: always()
        run: |
          sf org delete scratch --target-org ScratchOrg --no-prompt || true
          echo "✓ Scratch org cleanup completed"
